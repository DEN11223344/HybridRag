version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.8.2
    container_name: hybrid_rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hybrid_rag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=pdf_hybrid_rag
      - DENSE_MODEL=BAAI/bge-small-en-v1.5
      - DENSE_DIM=384
      - SPLADE_MODEL=prithivida/Splade_PP_en_v1
      - RERANKER_MODEL=BAAI/bge-reranker-base
      - CPU_NUM_THREADS=4
      - LLM_PROVIDER=mock
      - UPLOAD_DIR=data/uploads
      - EXTRACTED_DIR=data/extracted
      - PROCESSED_DIR=data/processed
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/extracted:/app/data/extracted
      - ./data/processed:/app/data/processed
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
  uploads:
  extracted:
